<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GHOST EMPIRE</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#050505;
--panel:#0c0c0f;
--panel2:#111116;
--border:#22222a;
--text:#f5f5f5;
--muted:#85858f;
--primary:#8b5cf6;
--primary2:#a78bfa;
--green:#22c55e;
--gold:#f5c451;
--danger:#ef4444;
}

body{
font-family:Inter,Arial,sans-serif;
background:
radial-gradient(circle at 50% -10%,#241344 0,transparent 38%),
var(--bg);
color:var(--text);
min-height:100vh;
}

button{font:inherit}

.header{
height:76px;
border-bottom:1px solid var(--border);
background:rgba(5,5,5,.9);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 28px;
position:sticky;
top:0;
z-index:10;
backdrop-filter:blur(12px);
}

.logo{
font-weight:900;
letter-spacing:3px;
font-size:20px;
}

.logo span{color:var(--primary2)}

.headerStats{
display:flex;
gap:25px;
}

.headerStat{
display:flex;
flex-direction:column;
align-items:flex-end;
}

.headerStat small{
font-size:10px;
color:var(--muted);
text-transform:uppercase;
}

.headerStat strong{
font-size:17px;
}

.layout{
max-width:1400px;
margin:auto;
padding:25px;
display:grid;
grid-template-columns:270px 1fr 300px;
gap:20px;
}

.panel{
background:linear-gradient(145deg,#0e0e12,#09090b);
border:1px solid var(--border);
border-radius:18px;
padding:18px;
box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.panelTitle{
font-size:12px;
color:var(--muted);
text-transform:uppercase;
letter-spacing:2px;
margin-bottom:15px;
}

.profile{
display:flex;
align-items:center;
gap:12px;
padding-bottom:18px;
border-bottom:1px solid var(--border);
}

.avatar{
width:50px;
height:50px;
border-radius:14px;
display:grid;
place-items:center;
font-size:25px;
background:linear-gradient(145deg,#17121f,#09070d);
border:1px solid #39245c;
box-shadow:0 0 25px rgba(139,92,246,.18);
}

.profile strong{display:block}
.profile small{color:var(--muted)}

.xp{
margin-top:15px;
}

.xpTop{
display:flex;
justify-content:space-between;
font-size:11px;
color:var(--muted);
margin-bottom:7px;
}

.bar{
height:7px;
background:#18181c;
border-radius:20px;
overflow:hidden;
}

.bar i{
display:block;
height:100%;
width:0%;
background:linear-gradient(90deg,var(--primary),var(--primary2));
border-radius:20px;
transition:.3s;
}

.center{
min-width:0;
}

.hero{
text-align:center;
padding:25px 10px 10px;
}

.hero h1{
font-size:clamp(28px,4vw,52px);
letter-spacing:-2px;
}

.hero p{
color:var(--muted);
margin-top:8px;
}

.currency{
margin:25px auto 15px;
font-size:clamp(32px,5vw,58px);
font-weight:900;
letter-spacing:-2px;
}

.currency small{
font-size:14px;
color:var(--muted);
letter-spacing:1px;
}

.coinButton{
width:min(290px,70vw);
height:min(290px,70vw);
max-width:290px;
max-height:290px;
border-radius:50%;
border:1px solid #6841a5;
background:
radial-gradient(circle at 35% 25%,#c4b5fd,#8b5cf6 35%,#3b176e 75%,#170a2b);
color:white;
cursor:pointer;
box-shadow:
0 0 0 12px rgba(139,92,246,.05),
0 0 70px rgba(139,92,246,.35),
inset 0 -25px 40px rgba(0,0,0,.35);
transition:.12s;
user-select:none;
}

.coinButton:hover{
transform:scale(1.025);
box-shadow:
0 0 0 15px rgba(139,92,246,.06),
0 0 90px rgba(139,92,246,.5),
inset 0 -25px 40px rgba(0,0,0,.35);
}

.coinButton:active{
transform:scale(.95);
}

.ghost{
font-size:85px;
display:block;
filter:drop-shadow(0 8px 15px rgba(0,0,0,.5));
}

.coinText{
display:block;
font-size:13px;
font-weight:900;
letter-spacing:3px;
margin-top:5px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:25px;
}

.stat{
padding:14px;
border:1px solid var(--border);
background:#0b0b0e;
border-radius:12px;
text-align:center;
}

.stat small{
display:block;
color:var(--muted);
font-size:10px;
text-transform:uppercase;
margin-bottom:5px;
}

.stat strong{font-size:18px}

.section{
margin-top:20px;
}

.upgrade{
appearance:none;
width:100%;
text-align:left;
color:var(--text);
font:inherit;
border:1px solid var(--border);
background:#0b0b0e;
border-radius:13px;
padding:13px;
margin-bottom:9px;
cursor:pointer;
transition:.18s;
}

.upgrade:hover{
border-color:#55358b;
transform:translateY(-1px);
}

.upgrade.disabled{
opacity:.45;
}

.upgradeTop{
display:flex;
justify-content:space-between;
gap:10px;
}

.upgradeName{
font-size:13px;
font-weight:800;
}

.level{
font-size:10px;
color:var(--primary2);
}

.upgradeDesc{
font-size:10px;
color:var(--muted);
margin:5px 0 10px;
}

.buy{
display:flex;
justify-content:space-between;
font-size:11px;
}

.cost{color:var(--gold)}

.mission{
border:1px solid var(--border);
padding:12px;
border-radius:12px;
margin-bottom:9px;
background:#0a0a0d;
}

.missionName{
font-weight:800;
font-size:12px;
}

.missionDesc{
font-size:10px;
color:var(--muted);
margin:4px 0 8px;
}

.reward{
color:var(--gold);
font-size:10px;
}

.achievement{
display:flex;
align-items:center;
gap:10px;
padding:10px 0;
border-bottom:1px solid #18181c;
}

.achievement:last-child{border:0}

.achievementIcon{
width:36px;
height:36px;
border-radius:10px;
display:grid;
place-items:center;
background:#15151a;
}

.achievement.locked{
opacity:.35;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:15px;
}

.action{
border:1px solid var(--border);
background:#111116;
color:white;
border-radius:10px;
padding:10px;
cursor:pointer;
font-size:11px;
}

.action:hover{border-color:#60429a}

.float{
position:fixed;
pointer-events:none;
font-weight:900;
font-size:20px;
color:#c4b5fd;
animation:float 800ms ease-out forwards;
z-index:100;
}

@keyframes float{
0%{opacity:1;transform:translateY(0) scale(1)}
100%{opacity:0;transform:translateY(-90px) scale(1.2)}
}

.toast{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%) translateY(30px);
background:#111116;
border:1px solid #3a2855;
padding:12px 18px;
border-radius:12px;
opacity:0;
pointer-events:none;
transition:.3s;
z-index:200;
font-size:12px;
box-shadow:0 15px 40px #000;
}

.toast.show{
opacity:1;
transform:translateX(-50%) translateY(0);
}

.combo{
text-align:center;
height:24px;
font-size:12px;
font-weight:800;
color:var(--gold);
}

@media(max-width:1050px){
.layout{
grid-template-columns:230px 1fr;
}
.right{
grid-column:1/-1;
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}
}

@media(max-width:700px){
.header{padding:0 15px}
.headerStats{gap:10px}
.headerStat:nth-child(2){display:none}

.layout{
display:block;
padding:12px;
}

.left,.right{margin-top:15px}

.right{
display:block;
}

.coinButton{
width:240px;
height:240px;
}

.ghost{font-size:70px}

.stats{grid-template-columns:1fr 1fr 1fr}

.header{
height:65px;
}
}
</style>
</head>

<body>

<header class="header">
<div class="logo">GHOST<span>EMPIRE</span></div>

<div class="headerStats">
<div class="headerStat">
<small>Moedas</small>
<strong id="topCoins">0</strong>
</div>

<div class="headerStat">
<small>Produção</small>
<strong id="topPps">0/s</strong>
</div>

<div class="headerStat">
<small>Nível</small>
<strong id="topLevel">1</strong>
</div>
</div>
</header>

<main class="layout">

<!-- ESQUERDA -->
<aside class="left">

<div class="panel">

<div class="profile">
<div class="avatar">👻</div>
<div>
<strong>Ghost</strong>
<small id="rank">Novato</small>
</div>
</div>

<div class="xp">
<div class="xpTop">
<span>XP</span>
<span id="xpText">0 / 100</span>
</div>
<div class="bar"><i id="xpBar"></i></div>
</div>

</div>

<div class="panel section">

<div class="panelTitle">Upgrades</div>

<div id="upgrades"></div>

</div>

</aside>

<!-- CENTRO -->
<section class="center">

<div class="panel hero">

<h1>CONSTRUA SEU IMPÉRIO</h1>
<p>Comece pequeno. Evolua. Domine.</p>

<div class="currency">
<span id="coins">0</span>
<small> GHOST COINS</small>
</div>

<div class="combo" id="combo"></div>

<button class="coinButton" id="coin">
<span class="ghost">👻</span>
<span class="coinText">CLIQUE PARA PRODUZIR</span>
</button>

<div class="stats">

<div class="stat">
<small>Por clique</small>
<strong id="clickPower">+1</strong>
</div>

<div class="stat">
<small>Automático</small>
<strong id="pps">0/s</strong>
</div>

<div class="stat">
<small>Total produzido</small>
<strong id="total">0</strong>
</div>

</div>

</div>

<div class="panel section">

<div class="panelTitle">Progresso</div>

<div class="stats">

<div class="stat">
<small>Cliques</small>
<strong id="clicks">0</strong>
</div>

<div class="stat">
<small>Nível</small>
<strong id="level">1</strong>
</div>

<div class="stat">
<small>Combo</small>
<strong id="comboValue">x1</strong>
</div>

</div>

<div class="actions">
<button class="action" id="save">💾 Salvar</button>
<button class="action" id="reset">🗑️ Resetar</button>
</div>

</div>

</section>

<!-- DIREITA -->
<aside class="right">

<div class="panel">

<div class="panelTitle">Missões</div>

<div id="missions"></div>

</div>

<div class="panel section">

<div class="panelTitle">Conquistas</div>

<div id="achievements"></div>

</div>

</aside>

</main>

<div class="toast" id="toast"></div>

<script>

const SAVE_KEY="ghost_empire_v1";

const upgradeData={

click1:{
name:"Treino Fantasma",
desc:"+1 força por clique",
base:10,
type:"click",
power:1
},

click2:{
name:"Energia Sombria",
desc:"+5 força por clique",
base:100,
type:"click",
power:5
},

click3:{
name:"Núcleo Espectral",
desc:"+25 força por clique",
base:1000,
type:"click",
power:25
},

click4:{
name:"Poder Abissal",
desc:"+100 força por clique",
base:10000,
type:"click",
power:100
},

auto1:{
name:"Fantasma Assistente",
desc:"+1 moeda por segundo",
base:50,
type:"auto",
power:1
},

auto2:{
name:"Minerador Sombrio",
desc:"+10 moedas por segundo",
base:500,
type:"auto",
power:10
},

auto3:{
name:"Fábrica Espectral",
desc:"+100 moedas por segundo",
base:5000,
type:"auto",
power:100
},

auto4:{
name:"Império Automático",
desc:"+1000 moedas por segundo",
base:50000,
type:"auto",
power:1000
}

};

let game={
coins:0,
total:0,
clickPower:1,
pps:0,
clicks:0,
xp:0,
level:1,
combo:1,
comboTime:0,
upgrades:{
click1:0,
click2:0,
click3:0,
click4:0,
auto1:0,
auto2:0,
auto3:0,
auto4:0
},
missions:{
clicks:0,
coins:0,
auto:0
},
achievements:{}
};

const $=id=>document.getElementById(id);

const upgradesPanel = $("upgrades");

if(upgradesPanel){
  upgradesPanel.addEventListener("click", function(e){
    const button = e.target.closest("[data-upgrade]");

    if(!button) return;

    const id = button.dataset.upgrade;

    if(!upgradeData[id]) return;

    buyUpgrade(id);
  });
}


function format(n){

if(n<1000)return Math.floor(n).toLocaleString("pt-BR");

const units=["K","M","B","T","Qa","Qi"];

let i=-1;

while(n>=1000&&i<units.length-1){
n/=1000;
i++;
}

return n.toFixed(n>=100?0:n>=10?1:2)+units[i];
}

function upgradeCost(data,level){

return Math.floor(data.base*Math.pow(1.15,level));

}

function calculate(){

game.clickPower=1;
game.pps=0;

for(const id in upgradeData){

const data=upgradeData[id];
const level=game.upgrades[id];

if(data.type==="click")
game.clickPower+=data.power*level;

if(data.type==="auto")
game.pps+=data.power*level;

}

}

function addCoins(amount){

game.coins+=amount;
game.total+=amount;

gainXP(Math.max(1,Math.floor(amount/10)));

}

function gainXP(amount){

game.xp+=amount;

while(game.xp>=xpNeeded()){

game.xp-=xpNeeded();
game.level++;

toast("⬆️ Nível "+game.level+" alcançado!");

}

}

function xpNeeded(){

return Math.floor(100*Math.pow(1.18,game.level-1));

}

function clickCoin(){

let amount=game.clickPower*game.combo;

addCoins(amount);

game.clicks++;

game.missions.clicks++;

game.combo=Math.min(10,game.combo+.1);
game.comboTime=2;

showFloat(amount);

checkAchievements();

updateUI();

}

/* ===== AUTO CLIQUE ===== */
let autoClickTimer = null;

function startAutoClick(){
  if(autoClickTimer) return;

  autoClickTimer = setInterval(function(){
    if(typeof clickCoin === "function"){
      clickCoin();
    }
  }, 1000);
}

startAutoClick();


$("coin").addEventListener("click",clickCoin);

function showFloat(amount){

const el=document.createElement("div");

el.className="float";
el.textContent="+"+format(amount);

el.style.left=(Math.random()*50+25)+"%";
el.style.top=(Math.random()*25+35)+"%";

document.body.appendChild(el);

setTimeout(()=>el.remove(),800);

}

function buyUpgrade(id){
  const data = upgradeData[id];

  if(!data){
    console.error("Upgrade inexistente:", id);
    return;
  }

  if(!game.upgrades) game.upgrades = {};
  if(typeof game.upgrades[id] !== "number") game.upgrades[id] = 0;

  const level = game.upgrades[id];
  const cost = upgradeCost(data, level);

  if(game.coins < cost){
    toast("❌ Você precisa de " + format(cost) + " moedas");
    return;
  }

  game.coins -= cost;
  game.upgrades[id] = level + 1;

  calculate();

  toast("✅ " + data.name + " comprado!");

  save();
  updateUI();
}

game.coins-=cost;
game.upgrades[id]++;

calculate();

toast("✅ "+data.name+" melhorado!");

updateUI();
save();

}

function renderUpgrades(){
  const container = $("upgrades");

  if(!container) return;

  container.innerHTML = "";

  for(const id in upgradeData){
    const data = upgradeData[id];

    if(!game.upgrades[id]){
      game.upgrades[id] = 0;
    }

    const level = game.upgrades[id];
    const cost = upgradeCost(data, level);
    const canBuy = game.coins >= cost;

    const button = document.createElement("button");

    button.type = "button";
    button.className = "upgrade" + (canBuy ? "" : " disabled");
    button.dataset.upgrade = id;

    button.innerHTML =
      '<div class="upgradeTop">' +
        '<div class="upgradeName">' + data.name + '</div>' +
        '<div class="level">LV ' + level + '</div>' +
      '</div>' +
      '<div class="upgradeDesc">' + data.desc + '</div>' +
      '<div class="buy">' +
        '<span>' + (canBuy ? 'COMPRAR' : 'PRECISA DE MAIS MOEDAS') + '</span>' +
        '<span class="cost">🪙 ' + format(cost) + '</span>' +
      '</div>';

    button.onclick = function(){
      buyUpgrade(id);
    };

    container.appendChild(button);
  }
}
function renderMissions(){

$("missions").innerHTML="";

for(const m of missionData){

let value;

if(m.id==="clicks")value=game.missions.clicks;
if(m.id==="coins")value=game.total;
if(m.id==="auto")value=game.pps;

const done=value>=m.target;

const div=document.createElement("div");

div.className="mission";

div.innerHTML=`
<div class="missionName">${done?"✅":"🎯"} ${m.name}</div>
<div class="missionDesc">${m.desc}</div>
<div class="missionDesc">${Math.min(value,m.target).toLocaleString("pt-BR")} / ${m.target.toLocaleString("pt-BR")}</div>
<div class="reward">+${format(m.reward)} moedas</div>
`;

if(done && !game["mission_"+m.id]){

game["mission_"+m.id]=true;
game.coins+=m.reward;
toast("🎁 Missão concluída!");

}

$("missions").appendChild(div);

}

}

const achievementData=[

["first","👻","Primeiro contato","Faça 1 clique",1],
["hundred","⚡","Ritmo","Faça 100 cliques",100],
["rich","💰","Rico","Tenha 10.000 moedas",10000],
["million","👑","Magnata","Produza 1.000.000 moedas",1000000],
["level10","🔥","Ascensão","Chegue ao nível 10",10],
["combo","💥","Insano","Alcance combo x10",10]

];

function checkAchievements(){

for(const a of achievementData){

let value=0;

if(a[0]==="first")value=game.clicks;
if(a[0]==="hundred")value=game.clicks;
if(a[0]==="rich")value=game.coins;
if(a[0]==="million")value=game.total;
if(a[0]==="level10")value=game.level;
if(a[0]==="combo")value=game.combo;

if(value>=a[4]&&!game.achievements[a[0]]){

game.achievements[a[0]]=true;

game.coins+=Math.floor(a[4]*5);

toast("🏆 "+a[2]);

}

}

}

function renderAchievements(){

$("achievements").innerHTML="";

for(const a of achievementData){

const unlocked=game.achievements[a[0]];

const div=document.createElement("div");

div.className="achievement"+(unlocked?"":" locked");

div.innerHTML=`
<div class="achievementIcon">${a[1]}</div>
<div>
<strong>${a[2]}</strong>
<div style="font-size:10px;color:#85858f">${a[3]}</div>
</div>
`;

$("achievements").appendChild(div);

}

}

function updateUI(){

calculate();

$("coins").textContent=format(game.coins);
$("topCoins").textContent=format(game.coins);

$("pps").textContent=format(game.pps)+"/s";
$("topPps").textContent=format(game.pps)+"/s";

$("clickPower").textContent="+"+format(game.clickPower);

$("total").textContent=format(game.total);
$("clicks").textContent=game.clicks.toLocaleString("pt-BR");

$("level").textContent=game.level;
$("topLevel").textContent=game.level;

$("comboValue").textContent="x"+game.combo.toFixed(1);

const need=xpNeeded();

$("xpText").textContent=
Math.floor(game.xp)+" / "+need;

$("xpBar").style.width=
Math.min(100,game.xp/need*100)+"%";

if(game.level>=25)
$("rank").textContent="Senhor do Império";
else if(game.level>=15)
$("rank").textContent="Magnata Fantasma";
else if(game.level>=10)
$("rank").textContent="Mestre Sombrio";
else if(game.level>=5)
$("rank").textContent="Empresário";
else
$("rank").textContent="Novato";

renderUpgrades();
renderMissions();
renderAchievements();

}

function toast(text){

const el=$("toast");

el.textContent=text;
el.classList.add("show");

clearTimeout(toast.timer);

toast.timer=setTimeout(
()=>el.classList.remove("show"),
2200
);

}

function save(){

localStorage.setItem(
SAVE_KEY,
JSON.stringify(game)
);

}

function load(){

try{

const data=JSON.parse(
localStorage.getItem(SAVE_KEY)
);

if(data){

game={...game,...data};

game.upgrades={
...game.upgrades,
...(data.upgrades||{})
};

game.achievements={
...game.achievements,
...(data.achievements||{})
};

}

}catch(e){

console.log("Save inválido");

}

calculate();

}

$("save").onclick=()=>{

save();
toast("💾 Jogo salvo!");

};

$("reset").onclick=()=>{

if(confirm("Tem certeza que deseja apagar todo o progresso?")){

localStorage.removeItem(SAVE_KEY);
location.reload();

}

};

let last=performance.now();

function loop(now){

const delta=(now-last)/1000;
last=now;

if(game.pps>0){

const amount=game.pps*delta;

game.coins+=amount;
game.total+=amount;

}

if(game.comboTime>0){

game.comboTime-=delta;

}else{

game.combo=Math.max(1,game.combo-delta*.25);

}

updateUI();

requestAnimationFrame(loop);

}

load();
updateUI();

setInterval(save,5000);

requestAnimationFrame(loop);

</script>

</body>
</html>
